# Bob's helper Worker (phase 2). Deploy steps for Jeff: worker/README.md.
name = "bob-helper"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://bobthetechguy.com,https://www.bobthetechguy.com"

# Per-visitor limit: 20 chat requests a minute per IP (Workers Rate Limiting binding). Check the syntax against
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/ on the day; the Worker runs without it.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
